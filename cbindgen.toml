# cbindgen configuration for e-identity-stack FFI headers
#
# Generate headers with:
#   cbindgen --crate e_identity_sdk --output include/e_identity_sdk.h
#   cbindgen --crate e_moderation_sdk --output include/e_moderation_sdk.h

language = "C"
header = """/* Auto-generated by cbindgen — do not edit manually.
 *
 * E-Identity Stack FFI Bindings
 * Privacy-preserving anonymous identity registry for Logos Execution Zone.
 *
 * All JSON strings returned by ffi_* functions must be freed
 * with the corresponding ffi_*_free_string function.
 */"""

include_guard = "E_IDENTITY_STACK_FFI_H"

autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify manually. */"

[defines]
# No conditional defines needed

[export]
include = []
exclude = []

[export.rename]

[fn]
# Prefix all exported functions
rename_args = "None"

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"

[parse]
parse_deps = false
